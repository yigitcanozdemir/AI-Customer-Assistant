services:
  db:
    image: ankane/pgvector
    container_name: ecommerce-db
    shm_size: 128mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: ecommerce-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  fastapi:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.prod
    container_name: fastapi
    init: true
    ports:
      - "8000:8000"
    expose:
      - "8000"
    env_file:
      - .env.prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network
      - proxy-tier

  # Application telemetry: traces, metrics and logs in one ~300MB container.
  # Behind the `obs` profile so a plain `docker compose -f docker-compose.prod.yml
  # up -d` stays lean; start it with `--profile obs`.
  #
  # No published ports: the UI is reachable over Tailscale on the host, or via
  # Nginx Proxy Manager if you choose to expose it. Leaving 5080 unpublished
  # keeps an unauthenticated-by-default dashboard off the public internet.
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: openobserve
    profiles: ["obs"]
    restart: unless-stopped
    # Credentials and retention come from .env.prod (ZO_ROOT_USER_EMAIL,
    # ZO_ROOT_USER_PASSWORD, ZO_COMPACT_DATA_RETENTION_DAYS).
    #
    # Read via env_file rather than `${VAR:?...}` interpolation: interpolation is
    # resolved when compose PARSES this file, which only sees the shell env and a
    # root .env — not env_file. A `:?` guard here therefore fails even when the
    # value is correctly set in .env.prod.
    #
    # Without ZO_COMPACT_DATA_RETENTION_DAYS, OpenObserve keeps telemetry for its
    # default 3650 days (10 years) and will fill a small VPS disk. Minimum is 3.
    env_file:
      - .env.prod
    environment:
      ZO_DATA_DIR: "/data"
    expose:
      - "5080"
    volumes:
      - openobserve_data:/data
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
  proxy-tier:
    external: true

volumes:
  postgres_data:
  redis_data:
  openobserve_data:
